name: Approve gated workflow runs

# Safety net for the PR automation chain.
#
# `pr-reviewed` approves whatever is waiting when Copilot's review lands, but it
# only sees the runs that exist at that instant. Anything queued afterwards — a
# re-run, a slow check suite, a run registered moments later — has no event to
# release it, and a run left in `action_required` blocks the merge gate forever.
#
# This is the backstop. A `schedule` run's actor is the last person to touch the
# workflow file, never Copilot, so it is the one trigger that cannot itself end
# up gated behind the thing it exists to fix.
#
# Scope matters. `POST /actions/runs/{id}/approve` only accepts runs from fork
# pull requests and runs queued by the Actions bot; anything else comes back
# 403 "This run is not from a fork pull request or queued by the Actions bot"
# and no token can release it — not even a repo admin's `repo`-scoped PAT. So
# this sweeps the runs attached to open pull requests and, when approve is
# refused, re-runs them instead: a re-run is attributed to this workflow's
# actor rather than to Copilot, so it is not gated a second time.

on:
  schedule:
    # Every ten minutes. GitHub delays scheduled runs under load, which only
    # costs latency here — `pr-reviewed` is still the fast path.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: approve-gated-runs
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Take humans out of the review queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `pr-copilot-review` does this properly — it also requests Copilot,
          # which needs a PAT. But its runs are held in `action_required` like
          # everything else on a Copilot PR, so a human can sit in the review
          # queue for hours before anything releases them. Stripping here as
          # well makes the relief immediate and independent of that release.
          copilot='copilot-pull-request-reviewer'

          prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
                  --json number,reviewRequests \
                  --jq ".[] | select([.reviewRequests[].login
                        | select(startswith(\"$copilot\") | not)] | length > 0)
                        | \"\(.number) \([.reviewRequests[].login
                        | select(startswith(\"$copilot\") | not)] | join(\",\"))\"")

          if [ -z "$prs" ]; then
            echo "No pull request has a non-Copilot reviewer."
            exit 0
          fi

          while read -r pr reviewers; do
            [ -z "$pr" ] && continue

            args=()
            while IFS= read -r login; do
              [ -z "$login" ] && continue
              args+=(-f "reviewers[]=$login")
            done <<< "$(tr ',' '\n' <<< "$reviewers")"

            # Non-gating cleanup: a failure here must not abort the sweep that
            # the rest of the chain depends on.
            if gh api --method DELETE "repos/$REPO/pulls/$pr/requested_reviewers" \
                 "${args[@]}" --silent; then
              echo "Removed $reviewers from #$pr."
            else
              echo "::notice::Could not remove $reviewers from #$pr."
            fi
          done <<< "$prs"

      - name: Label pull requests Copilot has already reviewed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `pr-reviewed` labels on `pull_request_review`; reconciling here
          # covers a held/missed event and any ordering where the review run
          # arrives after this sweep.
          prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
                  --json number,headRefOid,labels \
                  --jq '.[] | select([.labels[].name] | index("reviewed") == null)
                        | "\(.number) \(.headRefOid)"')

          if [ -z "$prs" ]; then
            echo "Every open pull request is already labelled."
            exit 0
          fi

          while read -r pr head; do
            [ -z "$pr" ] && continue

            # The label must mean "Copilot reviewed *this* head", not "Copilot
            # reviewed at some point", or a later push would keep a stale label.
            reviewed=$(gh api "repos/$REPO/pulls/$pr/reviews" --paginate \
                         --jq "[.[] | select(.commit_id == \"$head\")
                               | select(.user.login | startswith(\"copilot-pull-request-reviewer\"))] | length")

            if [ "$reviewed" -eq 0 ]; then
              echo "#$pr has no Copilot review for $head yet."
              continue
            fi

            gh pr edit "$pr" --repo "$REPO" --add-label reviewed
            echo "Labelled #$pr as reviewed."
          done <<< "$prs"

      - name: Approve runs waiting on open pull requests
        env:
          # GITHUB_TOKEN, not a PAT. `actions: write` below is enough to re-run
          # a held run, and the fine-grained PAT this repo carries for assigning
          # Copilot has no Actions permission at all — it fails with 403
          # "Resource not accessible by personal access token".
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Two classes of held run matter, and they are identified differently.
          #
          # A `pull_request` CI run carries the PR head SHA, so it is matched by
          # comparing against the heads of the open PRs. Runs on branches with
          # no open PR are ignored: they never gate a merge, and sweeping them
          # would generate noise on every tick.
          #
          # A `workflow_run` run — this chain's own auto-merge step — reports the
          # *default branch* SHA instead, so no PR head will ever match it. It is
          # matched on the event type. Re-running one that has nothing to do is
          # harmless; it evaluates, finds no eligible PR, and exits.
          heads=$(gh pr list --repo "$REPO" --state open --limit 100 \
                    --json headRefOid --jq '.[].headRefOid')

          pending=$(gh api "repos/$REPO/actions/runs?status=action_required&per_page=100" \
                      --jq '.workflow_runs[] | "\(.head_sha)\t\(.event)\t\(.id)\t\(.name)"')

          if [ -z "$pending" ]; then
            echo "Nothing is awaiting approval."
            exit 0
          fi

          approved=0
          skipped=0

          while IFS=$'\t' read -r run_sha event run_id name; do
            [ -z "$run_id" ] && continue

            if [ "$event" = "workflow_run" ]; then
              :
            elif printf '%s\n' "$heads" | grep -qx "$run_sha"; then
              :
            else
              continue
            fi

            echo "Releasing $run_id — $name ($event)"
            if gh api --method POST "repos/$REPO/actions/runs/$run_id/approve" >/dev/null 2>&1; then
              approved=$((approved + 1))
            elif rerun_err=$(gh api --method POST "repos/$REPO/actions/runs/$run_id/rerun" 2>&1 >/dev/null); then
              # Approve is refused for anything that is not a fork-PR run or an
              # Actions-bot run, which is every run on a same-repo Copilot
              # branch. A re-run re-queues the jobs under this workflow's actor
              # rather than Copilot's, so it is not held a second time.
              echo "Approve unavailable for $run_id; re-ran it instead."
              approved=$((approved + 1))
            else
              # Never fatal: one unreleasable run must not stop the sweep, and
              # the next tick retries anyway.
              echo "::notice::Run $run_id could be neither approved nor re-run: $rerun_err"
              skipped=$((skipped + 1))
            fi
          done <<< "$pending"

          echo "Approved $approved run(s); skipped $skipped that the API will not release."
