name: PR reviewed by Copilot

# Step 2 of the PR automation chain. Fires when Copilot submits its review:
# labels the PR `reviewed` and approves the CI workflow runs that are sitting in
# `action_required`, which is the state every run enters on a Copilot coding
# agent pull request until a maintainer (or this workflow) releases it.
#
# Deterministic, so a plain GitHub Action rather than an agentic workflow.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to mark reviewed and unblock CI for
        required: true
        type: number

concurrency:
  group: pr-reviewed-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  reviewed:
    # The review API strips the `[bot]` suffix in some payloads and keeps it in
    # others, so match on the prefix rather than the exact login.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.review.user.login, 'copilot-pull-request-reviewer')
    runs-on: ubuntu-latest
    steps:
      - name: Label the PR reviewed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state; nothing to label."
            exit 0
          fi

          gh pr edit "$PR" --repo "$REPO" --add-label reviewed
          echo "Labelled #$PR as reviewed."

      - name: Release the workflow runs waiting on this PR
        env:
          # Two different mechanisms, because the approve endpoint is much
          # narrower than its docs suggest: it only accepts fork-PR runs and
          # runs queued by the Actions bot. A run held on a same-repo Copilot
          # branch is refused with 403 even for a repo admin with a
          # `repo`-scoped PAT, so no secret can fix it. Re-running the run does
          # work, because the re-run is attributed to the actor that triggered
          # it rather than to Copilot, so that is the fallback.
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          head_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          echo "PR #$PR head is $head_sha"

          released=0

          # The review can land before the CI runs for the head commit have been
          # registered, so give them a short window to appear before giving up.
          for attempt in 1 2 3 4 5; do
            runs=$(gh api "repos/$REPO/actions/runs?status=action_required&per_page=100" \
                     --jq ".workflow_runs[] | select(.head_sha == \"$head_sha\") | .id")

            for run_id in $runs; do
              echo "Releasing workflow run $run_id"
              if err=$(gh api --method POST "repos/$REPO/actions/runs/$run_id/approve" 2>&1 >/dev/null); then
                released=$((released + 1))
              elif printf '%s' "$err" | grep -q "not from a fork pull request"; then
                # Expected on a same-repo Copilot branch. Re-run it instead:
                # that re-queues the jobs under this workflow's actor, which is
                # not subject to the fork-contributor approval policy.
                if rerun_err=$(gh api --method POST "repos/$REPO/actions/runs/$run_id/rerun" 2>&1 >/dev/null); then
                  echo "Approve is not available for run $run_id; re-ran it instead."
                  released=$((released + 1))
                else
                  echo "::notice::Run $run_id could be neither approved nor re-run: $rerun_err"
                fi
              else
                echo "::error::Could not approve workflow run $run_id: $err"
                echo "::error::Set the COPILOT_ASSIGN_TOKEN secret to a token with the \`repo\` scope — the default GITHUB_TOKEN is not an accepted approver."
                exit 1
              fi
            done

            if [ "$released" -gt 0 ] || [ "$attempt" -eq 5 ]; then
              break
            fi

            echo "No runs awaiting approval yet (attempt $attempt/5); waiting 15s."
            sleep 15
          done

          if [ "$released" -eq 0 ]; then
            # Not an error: repositories that do not gate runs for this author
            # never produce an `action_required` run in the first place.
            echo "No workflow runs were awaiting approval for $head_sha."
          else
            echo "Released $released workflow run(s) for #$PR."
          fi
