name: Deploy

# Runs automatically after every merge into `main`, plus manual dispatch.
#
# Two automatic entry points, because a merge made with GITHUB_TOKEN raises no
# `push` event (recursion guard):
#   - `push` to main       covers merges a human performs.
#   - `workflow_dispatch`  sent by `pr-auto-merge` right after it merges, which
#                          covers the bot merges. `workflow_dispatch` is exempt
#                          from the recursion guard.
# Both deploy to the default environment with the manual-run defaults. The PR's
# CI was already required green before merge, so this does not wait on the
# post-merge CI run. The concurrency group below serialises overlapping deploys.
#
# Prerequisites (per GitHub environment, under Settings > Environments):
#   Secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#             (federated / OIDC credential on the app registration)
#   Variables AZURE_LOCATION           e.g. eastus2
#             AGENT_SERVICE_URL        backend endpoint for the smoke tests
#             STATIC_WEB_APP_URL       frontend endpoint for the smoke tests
#   Infra     the azd environment must already be provisioned, or run this
#             workflow once with `provision: true`.
#
# `turbo-akte-agent` is the already-provisioned environment and is the default;
# `staging` and `production` have no infrastructure yet and need `provision: true`.
# Add required reviewers to the `production` environment to gate releases.

on:
  push:
    branches: [main]
    # Nothing deployable changes when only prose does.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [turbo-akte-agent, staging, production]
        default: turbo-akte-agent
      provision:
        description: "Run `azd provision` first (needed for a brand-new environment)"
        type: boolean
        default: false
      upload_use_cases:
        description: "Upload use-case skills to blob storage (needs network access to the storage account)"
        type: boolean
        default: false
      deploy_sre_agent:
        description: "Provision the opt-in read-only Azure SRE Agent (needs `provision: true` and SRE access in the subscription)"
        type: boolean
        default: false
      sre_connect_telemetry:
        description: "Configure read-only workload telemetry connectors when provisioning SRE (query verification remains manual)"
        type: boolean
        default: true
      sre_location:
        description: "Region for the SRE Agent (blank = same region as the application, if supported)"
        type: string
        default: ""
      sre_agent_name:
        description: "Optional SRE Agent name override (blank = deterministic environment-scoped name)"
        type: string
        default: ""
      sre_connect_github:
        description: "Attach GitHub Code Access when SRE is enabled (authorization may remain pending)"
        type: boolean
        default: true
      sre_github_repository_url:
        description: "GitHub repository URL (blank = pascalvanderheiden/akte-agent)"
        type: string
        default: ""
      sre_github_branch:
        description: "GitHub branch (blank = discover the target repository default branch)"
        type: string
        default: ""
      run_integration_tests:
        description: "Run integration tests after deploying"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  # Never let two deploys to the same environment overlap. On push, `inputs` is
  # empty, so every `inputs.*` reference falls back to the manual-run default.
  group: deploy-${{ inputs.environment || 'turbo-akte-agent' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'turbo-akte-agent' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'turbo-akte-agent' }}
    steps:
      - uses: actions/checkout@v7

      # Fail loudly and early: an unset secret otherwise surfaces as an opaque
      # "Not all values are present" error from azure/login.
      - name: Check required credentials are configured
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ]       || missing+=(AZURE_CLIENT_ID)
          [ -n "$AZURE_TENANT_ID" ]       || missing+=(AZURE_TENANT_ID)
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=(AZURE_SUBSCRIPTION_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets for environment '${{ inputs.environment || 'turbo-akte-agent' }}': ${missing[*]}"
            echo "Add them under Settings > Environments > ${{ inputs.environment || 'turbo-akte-agent' }} > Environment secrets."
            exit 1
          fi
          echo "✅ All required credentials are present."

      # v1.0.0 installs from azdrelease.azureedge.net, which no longer resolves
      # (the Azure Edgio CDN was retired). v2.x installs from GitHub releases.
      - name: Install azd
        uses: Azure/setup-azd@v2.4.0

      # `azure.yaml` declares the Foundry agents extension for the hosted
      # `kratos-agent` service, and azd refuses to auto-install extensions in
      # CI. Install it explicitly before any command that reads `azure.yaml`,
      # otherwise every one of them fails with "Auto-installation is not
      # supported in CI/CD environments".
      - name: Install azd extensions
        run: azd extension install azure.ai.agents --source azd

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to azd
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}" \
            --federated-credential-provider github

      - name: Select azd environment
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # The runner starts with no .azure/ directory, so create the env on
          # first use and select it on subsequent runs.
          azd env select "$AZURE_ENV_NAME" 2>/dev/null || \
            azd env new "$AZURE_ENV_NAME" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --no-prompt

      # Nonsecret SRE options, recorded with the supported azd command rather
      # than by editing .azure/. Deploy-only runs must not change opt-in state.
      # Disabling does not delete an existing agent — see docs/sre-agent.md.
      - name: Configure SRE Agent options
        if: inputs.provision
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
          # Passed through env rather than interpolated into the script body,
          # so a value cannot be executed by the runner.
          DEPLOY_SRE_AGENT_INPUT: ${{ inputs.deploy_sre_agent }}
          SRE_CONNECT_TELEMETRY_INPUT: ${{ github.event_name == 'push' || inputs.sre_connect_telemetry }}
          SRE_LOCATION_INPUT: ${{ inputs.sre_location }}
          SRE_AGENT_NAME_INPUT: ${{ inputs.sre_agent_name }}
          SRE_CONNECT_GITHUB_INPUT: ${{ github.event_name == 'push' || inputs.sre_connect_github }}
          SRE_GITHUB_REPOSITORY_URL_INPUT: ${{ inputs.sre_github_repository_url }}
          SRE_GITHUB_BRANCH_INPUT: ${{ inputs.sre_github_branch }}
        run: |
          source ./hooks/sre-lib.sh
          sre_bool SRE_CONNECT_GITHUB "${SRE_CONNECT_GITHUB_INPUT:-}" true >/dev/null || exit 1
          sre_bool SRE_CONNECT_TELEMETRY "${SRE_CONNECT_TELEMETRY_INPUT:-}" true >/dev/null || exit 1
          azd env set DEPLOY_SRE_AGENT "$DEPLOY_SRE_AGENT_INPUT"
          azd env set SRE_CONNECT_TELEMETRY "${SRE_CONNECT_TELEMETRY_INPUT:-true}"
          azd env set SRE_CONNECT_GITHUB "${SRE_CONNECT_GITHUB_INPUT:-true}"
          azd env set SRE_GITHUB_REPOSITORY_URL "$SRE_GITHUB_REPOSITORY_URL_INPUT"
          azd env set SRE_GITHUB_BRANCH "$SRE_GITHUB_BRANCH_INPUT"
          # Empty inputs clear old overrides rather than retaining stale values.
          azd env set SRE_LOCATION "$SRE_LOCATION_INPUT"
          azd env set SRE_AGENT_NAME_OVERRIDE "$SRE_AGENT_NAME_INPUT"
          # CI signs in with a federated service principal, so role assignments
          # must not assume a User principal.
          azd env set AZURE_PRINCIPAL_TYPE ServicePrincipal

      - name: Provision infrastructure
        if: inputs.provision
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: azd provision --no-prompt

      - name: Refresh environment outputs
        if: ${{ !inputs.provision }}
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Hydrate endpoints/resource names from the already-provisioned infra;
          # `azd deploy` needs these and a fresh runner has none.
          azd env refresh --no-prompt

      # This is the only step allowed to receive the optional dedicated PAT.
      # The same entry point rechecks an existing core; it never provisions one.
      - name: Set up SRE GitHub access
        if: github.event_name == 'push' || inputs.sre_connect_github
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
          SRE_GITHUB_PAT: ${{ secrets.SRE_GITHUB_PAT }}
        run: ./hooks/sre-setup.sh --environment "$AZURE_ENV_NAME"

      - name: Deploy
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          KRATOS_AUTO_UPLOAD_USE_CASES: ${{ inputs.upload_use_cases && '1' || '0' }}
        run: azd deploy --no-prompt

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Deploy to \`${{ inputs.environment || 'turbo-akte-agent' }}\`"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Result | ${{ job.status }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Provisioned | ${{ inputs.provision }} |"
            echo "| Skills uploaded | ${{ inputs.upload_use_cases }} |"
            echo "| SRE core provisioning requested | ${{ inputs.provision && inputs.deploy_sre_agent }} (readiness in SRE_RESULT log) |"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' || inputs.run_integration_tests
    environment: ${{ inputs.environment || 'turbo-akte-agent' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # The Akte specs drive the packaged catalogue through the real backend,
      # so they shell out to `src/backend/.venv/bin/python`. A runner has no
      # virtualenv, and without one those specs fail with a bare ENOENT.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Create the backend virtualenv
        working-directory: src/backend
        # The Akte fixtures import `tests.test_akte_artifacts`, which imports
        # pytest. pytest lives in the `dev` extra, and a plain `uv sync` skips
        # optional-dependency extras.
        run: uv sync --frozen --extra dev

      - name: Azure Login for smoke telemetry
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Application Insights CLI extension
        run: az extension add --name application-insights --yes

      - name: Resolve smoke telemetry resource
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'turbo-akte-agent' }}
        run: |
          mapfile -t resources < <(az resource list \
            --resource-type Microsoft.Insights/components \
            --tag "azd-env-name=$AZURE_ENV_NAME" \
            --query "[].id" -o tsv)
          if [ "${#resources[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one App Insights resource for the smoke environment; found ${#resources[@]}."
            exit 1
          fi
          echo "KRATOS_APP_INSIGHTS_ID=${resources[0]}" >> "$GITHUB_ENV"

      # The e2e-smoke skill is the repository's post-deploy check. It normally
      # resolves its target from the local azd environment, which a runner does
      # not have, so pass the endpoints explicitly from environment variables.
      # Deliberately NOT `|| true`: these tests exist to catch a bad deploy, so
      # they must be able to fail the run.
      - name: Run e2e smoke tests
        env:
          KRATOS_BACKEND_URL: ${{ vars.AGENT_SERVICE_URL }}
          KRATOS_FRONTEND_URL: ${{ vars.STATIC_WEB_APP_URL }}
        run: ./.copilot/skills/e2e-smoke/run.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-report
          path: .copilot/skills/e2e-smoke/playwright-report
          retention-days: 7
          if-no-files-found: ignore
