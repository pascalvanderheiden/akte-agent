name: PR review by Copilot

# Step 1 of the PR automation chain:
#
#   pr-copilot-review  ->  pr-reviewed  ->  pr-auto-merge  ->  close-parent-issues
#
# Makes Copilot the sole reviewer of every pull request, and re-requests a review
# whenever the head commit moves so a review can never go stale under the
# auto-merge gate. Entirely deterministic, so this is a plain GitHub Action
# rather than an agentic workflow.
#
# Uses `pull_request_target`, not `pull_request`, so the workflow definition and
# secrets always come from the base branch. Nothing here checks out or executes
# PR code, which is what makes that safe — keep it that way.
#
# Note on the approval gate: runs on the Copilot coding agent's pull requests
# are held in `action_required` unless *Require approval for workflow runs* is
# disabled under Settings -> Copilot -> Cloud agent. This repository has it
# disabled, so these runs start on their own. If it is ever turned back on,
# nothing here can release them — `POST /actions/runs/{id}/approve` refuses
# same-repo runs — and `approve-gated-runs` has to re-run them instead. See
# docs/agents/pr-automation.md.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    # Every ten minutes, matching `pr-auto-merge`. The coding agent leaves its
    # pull requests in draft when it finishes, and finishing raises no webhook —
    # `copilot_work_finished` is a timeline entry, not an event. So the last
    # `synchronize` arrives *before* the agent is done and there is no later
    # event to react to. Without this sweep an agent PR sits in draft forever,
    # unreviewed, because the whole chain hangs off `ready_for_review`.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to request a Copilot review on. Leave empty to sweep every open PR.
        required: false
        type: number

concurrency:
  group: >-
    pr-copilot-review-${{
      github.event.pull_request.number ||
      inputs.pr_number ||
      github.event_name }}
  cancel-in-progress: false

permissions:
  # `contents: write` is here solely for the draft flip. `pull-requests: write`
  # alone is not enough for `markPullRequestReadyForReview`, which answers
  # `Resource not accessible by integration` — and the fine-grained
  # COPILOT_ASSIGN_TOKEN is refused outright, so the flip cannot be moved off
  # GITHUB_TOKEN either. Nothing here checks out or executes PR code, which is
  # what keeps that safe under `pull_request_target`.
  contents: write
  pull-requests: write

jobs:
  request-review:
    # Deliberately unconditional, including on a draft's pushes. An earlier
    # version skipped `synchronize` while draft, on the assumption that the
    # reviewer cleanup had already happened when the PR was opened. It had not:
    # the coding agent adds the reviewer at some point during drafting, and the
    # `opened` run is held in `action_required` anyway, so the only run that
    # ever reached the cleanup was a `synchronize` one — which was the run being
    # skipped. The result was a human sitting in the review queue for hours.
    # The script itself skips the review request on a draft, so the extra runs
    # are cheap.
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          prs="${EVENT_PR:-${DISPATCH_PR:-}}"

          # A sweep has no PR of its own. Oldest first, so a backlog drains in
          # the order it was opened.
          if [ -z "$prs" ]; then
            prs=$(gh pr list --repo "$REPO" --state open --limit 1000 \
                    --json number --jq 'sort_by(.number) | .[].number' | tr '\n' ' ')
          fi

          prs=$(echo "${prs:-}" | xargs || true)
          echo "Candidate pull request(s): ${prs:-none}"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - name: Make Copilot the only reviewer
        if: steps.resolve.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ steps.resolve.outputs.prs }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          copilot='copilot-pull-request-reviewer[bot]'

          evaluate_pr() {
          local PR="$1"

          pr_json=$(gh pr view "$PR" --repo "$REPO" \
            --json state,headRefOid,reviews,labels,isDraft,author)

          state=$(echo "$pr_json" | jq -r .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state; nothing to review."
            return 0
          fi

          head=$(echo "$pr_json" | jq -r .headRefOid)
          draft=$(echo "$pr_json" | jq -r .isDraft)

          requested=$(gh api "repos/$REPO/pulls/$PR/requested_reviewers")

          # Requested reviewers come back under `users` even when they are bots,
          # and the login there omits the `[bot]` suffix. Drop everyone else so
          # Copilot is left as the only outstanding review request.
          #
          # This runs before the draft check on purpose. The coding agent asks
          # the person who delegated the task to review its pull request, and
          # that request is what lands in a human's review queue — so clear it
          # straight away rather than leaving it there for the hours or days the
          # PR sits in draft. Removing a reviewer costs nothing and, unlike
          # adding one, works fine on a draft.
          drop_users=$(echo "$requested" | jq -c '
            [.users[].login | select(startswith("copilot-pull-request-reviewer") | not)]')
          drop_teams=$(echo "$requested" | jq -c '[.teams[].slug]')

          if [ "$drop_users" != "[]" ] || [ "$drop_teams" != "[]" ]; then
            echo "Removing existing reviewers: users=$drop_users teams=$drop_teams"
            jq -nc --argjson r "$drop_users" --argjson t "$drop_teams" \
              '{reviewers: $r, team_reviewers: $t}' \
              | gh api --method DELETE "repos/$REPO/pulls/$PR/requested_reviewers" --input - >/dev/null
          fi

          # GitHub accepts a review request on a draft with 200 OK and then
          # silently drops it, so a draft has to be lifted before asking.
          #
          # The coding agent does not take its own pull request out of draft when
          # it finishes, and finishing raises no webhook — `copilot_work_finished`
          # is a timeline entry only. So `ready_for_review`, which the rest of the
          # chain hangs off, never arrives on its own and the PR sits unreviewed
          # indefinitely. Lift it here instead, on the agent's own signal.
          #
          # `copilot_work_finished` is the precise signal: it lands after the
          # agent's last push, and a PR it has not finished with (or has resumed
          # work on, after `pr-address-review`) does not carry it as the latest
          # `copilot_work_*` entry. A draft opened by a human is left alone —
          # that draft is deliberate.
          if [ "$draft" = "true" ]; then
            author=$(echo "$pr_json" | jq -r '.author.login')

            if [ "$author" != "app/copilot-swe-agent" ] && [ "$author" != "Copilot" ]; then
              echo "PR #$PR is a human's draft; reviewers cleared, leaving it in draft."
              return 0
            fi

            last_agent_event=$(gh api "repos/$REPO/issues/$PR/timeline" --paginate \
              --jq '[.[] | select(.event == "copilot_work_started" or
                                  .event == "copilot_work_finished") | .event] | last // ""')

            if [ "$last_agent_event" != "copilot_work_finished" ]; then
              echo "PR #$PR is a draft and the coding agent has not finished (last signal: ${last_agent_event:-none}). Not requesting a review yet."
              return 0
            fi

            echo "Coding agent finished #$PR but left it in draft; marking it ready for review."
            # `gh pr ready` is GraphQL-only, and the fine-grained
            # COPILOT_ASSIGN_TOKEN is refused there
            # (`markPullRequestReadyForReview`), so this one call uses
            # GITHUB_TOKEN, which needs `contents: write` for it. Its
            # `ready_for_review` event is swallowed by the recursion guard,
            # which costs nothing: the review request is made further down in
            # this same run.
            GH_TOKEN="$DEFAULT_TOKEN" gh pr ready "$PR" --repo "$REPO"
            draft=false
          fi

          # The auto-merge gate only accepts a Copilot review of the current head
          # commit, so that is the same question asked here.
          if echo "$pr_json" | jq -e --arg head "$head" '
                .reviews[] | select(
                  (.author.login | startswith("copilot-pull-request-reviewer")) and
                  .commit.oid == $head)' >/dev/null; then
            echo "Copilot has already reviewed $head on #$PR."
            return 0
          fi

          # The head moved past whatever was reviewed, so any state the later
          # steps of the chain wrote is stale.
          for stale in reviewed ready-to-merge needs-fixes; do
            if echo "$pr_json" | jq -e --arg l "$stale" '.labels[] | select(.name == $l)' >/dev/null; then
              echo "Dropping stale '$stale' label — $head has not been reviewed."
              gh pr edit "$PR" --repo "$REPO" --remove-label "$stale"
            fi
          done

          if echo "$requested" | jq -e '.users[].login | startswith("copilot-pull-request-reviewer")' >/dev/null; then
            echo "Copilot review is already requested on #$PR."
            return 0
          fi

          echo "Requesting a review from $copilot on #$PR ($head)."
          if ! jq -nc --arg c "$copilot" '{reviewers: [$c]}' \
               | gh api --method POST "repos/$REPO/pulls/$PR/requested_reviewers" --input - >/dev/null; then
            echo "::error::Could not request a Copilot review on #$PR. Check that Copilot code review is enabled for this repository and that the AI credits budget is not exhausted."
            exit 1
          fi

          # The API answers 200 even when it quietly ignores the request. Copilot
          # can also leave `requested_reviewers` while its check is being queued,
          # so allow either observable state and give the check time to appear.
          review_started=false
          for attempt in {1..7}; do
            if gh api "repos/$REPO/pulls/$PR/requested_reviewers" \
                 | jq -e '.users[].login | startswith("copilot-pull-request-reviewer")' >/dev/null; then
              review_started=true
              break
            fi

            if gh api "repos/$REPO/commits/$head/check-runs" \
                 --jq '.check_runs[] | select(
                   .name == "copilot-pull-request-reviewer" and
                   .status != "completed")' | grep -q .; then
              review_started=true
              break
            fi

            if gh pr view "$PR" --repo "$REPO" --json reviews \
                 | jq -e --arg head "$head" '.reviews[] | select(
                   (.author.login | startswith("copilot-pull-request-reviewer")) and
                   .commit.oid == $head)' >/dev/null; then
              review_started=true
              break
            fi

            if [ "$attempt" -lt 7 ]; then
              sleep 5
            fi
          done

          if [ "$review_started" != "true" ]; then
            echo "::error::GitHub accepted the request but Copilot is not a reviewer on #$PR. Check that Copilot code review is enabled for this repository and that the AI credits budget is not exhausted."
            exit 1
          fi

          echo "Copilot is now the only requested reviewer on #$PR."
          }

          # Invoked as a plain command, never as an `if` condition: a function
          # call in a condition disarms `errexit` for its whole body. The two
          # `exit 1`s above are meant to fail the run — they mean Copilot code
          # review is off or out of credits, which affects every candidate, so
          # stopping the sweep there is right.
          for candidate in $PRS; do
            evaluate_pr "$candidate"
          done
