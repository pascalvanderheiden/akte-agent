name: Auto-merge reviewed PRs

# Step 3 of the PR automation chain. Once Copilot has reviewed the PR's current
# head commit and every CI check is green, labels the PR `ready-to-merge`,
# squash-merges it, and hands off to `close-parent-issues`.
#
# Deterministic, so a plain GitHub Action rather than an agentic workflow.
#
# Trigger choice matters here. A label written with GITHUB_TOKEN does not raise a
# `labeled` event, and `check_suite: completed` raised by Actions does not trigger
# workflows — both are recursion guards. So the event entry points are
# `pull_request_review` (checks may already be green when the review lands) and
# `workflow_run` (the review landed first and CI finished later);
# `pull_request_target: labeled` only exists for a human applying
# `ready-to-merge` by hand.
#
# Those two were assumed to cover every ordering. They do not. Copilot's
# *automatic* code review raises no `pull_request_review` event — see the note in
# `pr-reviewed` — so when the review lands after CI has already finished, there
# is no event left to fire and the PR sits approved and green forever. Hence the
# `schedule` sweep below, which re-evaluates every open PR against the identical
# gate. It is the backstop, not the fast path.
#
# The gate is "Copilot reviewed this exact head commit", not "the PR carries the
# `reviewed` label". The label is written by GITHUB_TOKEN and so cannot be a
# trigger, which would make it a lagging signal; the review itself cannot lag.

on:
  pull_request_review:
    types: [submitted]
  schedule:
    # Every ten minutes, matching `approve-gated-runs`. A scheduled run's actor
    # is the last person to touch the workflow file rather than Copilot, so it
    # is never gated behind the thing it exists to unstick.
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: [CI, CI Pipeline, Dependency compatibility]
    types: [completed]
    # Post-merge CI on the default branch has no PR to evaluate, but it still
    # spawns a run of this workflow — which then gates as `action_required`,
    # because the actor carried over from the merged PR is Copilot.
    branches-ignore: [main]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate and merge
        required: true
        type: number

concurrency:
  group: >-
    pr-auto-merge-${{
      github.event.pull_request.number ||
      github.event.workflow_run.head_branch ||
      inputs.pr_number ||
      github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_review' &&
        startsWith(github.event.review.user.login, 'copilot-pull-request-reviewer')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' &&
        github.event.label.name == 'ready-to-merge')
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merge.outputs.pr }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Resolve the pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            workflow_dispatch)
              pr="$DISPATCH_PR"
              ;;
            pull_request_review|pull_request_target)
              pr="$EVENT_PR"
              ;;
            schedule)
              # The sweep has no PR of its own, so every open one is a
              # candidate and the gate below decides. Oldest first, so a
              # backlog drains in the order it was opened.
              pr=$(gh pr list --repo "$REPO" --state open --limit 100 \
                     --json number --jq 'sort_by(.number) | .[].number' | tr '\n' ' ')
              ;;
            workflow_run)
              # `pull_requests` is populated for same-repo PRs and empty for
              # forks, so fall back to a branch lookup.
              pr="${RUN_PR:-}"
              if [ -z "$pr" ]; then
                pr=$(gh pr list --repo "$REPO" --head "$RUN_BRANCH" --state open \
                       --json number --jq '.[0].number // empty')
              fi
              ;;
          esac

          pr=$(echo "${pr:-}" | xargs || true)

          if [ -z "$pr" ]; then
            echo "No open pull request for this event; nothing to do."
            echo "prs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Candidate pull request(s): $pr"
          echo "prs=$pr" >> "$GITHUB_OUTPUT"

      - name: Merge when reviewed and green
        id: merge
        if: steps.resolve.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.resolve.outputs.prs }}
        run: |
          set -euo pipefail

          # Invoked as a simple command, never as an `if` condition: a function
          # call in a condition disarms `errexit` for its entire body, so a
          # failed `gh pr merge` would fall through to `merged=true` and cascade
          # `close-parents` for a merge that never happened. Success is reported
          # out of band through `MERGED` instead, which leaves every `gh`/`jq`
          # failure inside the function fatal. A gate miss is a normal `return
          # 0` — on the sweep that means "try the next candidate", on a
          # single-PR event "nothing to do".
          MERGED=false

          evaluate_pr() {
            local PR="$1"
          pr_json=$(gh pr view "$PR" --repo "$REPO" \
              --json state,isDraft,mergeable,headRefName,headRefOid,labels,reviews,statusCheckRollup)

            state=$(echo "$pr_json" | jq -r .state)
            draft=$(echo "$pr_json" | jq -r .isDraft)
            head=$(echo "$pr_json" | jq -r .headRefOid)

            if [ "$state" != "OPEN" ]; then
              echo "PR #$PR is $state; not merging."
              return 0
            fi

            # A draft is not disqualifying on its own. Copilot's automatic code
            # review runs on drafts, so an agent PR can be approved with every
            # check green and still sit here forever, because the coding agent
            # does not always take its own PR out of draft. The gates below —
            # a Copilot review of this exact head, no unresolved Copilot threads,
            # and a green rollup — are the same evidence `ready_for_review` would
            # have produced, so the draft is lifted at the merge step instead.
            if [ "$draft" = "true" ]; then
              echo "PR #$PR is a draft; evaluating it anyway and lifting the draft if it qualifies."
            fi

            reviewed=false
            override=false
            if echo "$pr_json" | jq -e --arg head "$head" '
                  .reviews[] | select(
                    (.author.login | startswith("copilot-pull-request-reviewer")) and
                    .commit.oid == $head)' >/dev/null; then
              reviewed=true
            elif echo "$pr_json" | jq -e '.labels[] | select(.name == "ready-to-merge")' >/dev/null; then
              # A human applied the label deliberately; take them at their word.
              echo "No Copilot review of $head, but 'ready-to-merge' was applied by hand."
              reviewed=true
              override=true
            fi

            if [ "$reviewed" != "true" ]; then
              echo "Copilot has not reviewed $head yet; not merging."
              return 0
            fi

            # "Copilot reviewed this head" is not the same as "Copilot was happy
            # with it". A `COMMENTED` review with open threads used to sail
            # straight through this gate, merging code the review had objected to.
            # `pr-address-review` hands those back to the coding agent; this is the
            # gate that gives it time to answer.
            #
            # `isOutdated` threads are anchored to lines that have since changed,
            # so they are about code that no longer exists — blocking on them would
            # never clear. Review threads are GraphQL-only, hence the second call.
            if [ "$override" != "true" ]; then
              # `$owner`/`$name`/`$number` are GraphQL variables, not shell ones.
              # shellcheck disable=SC2016
              unresolved=$(gh api graphql \
                -f owner="${REPO%%/*}" -f name="${REPO##*/}" -F number="$PR" \
                -f query='
                  query($owner:String!, $name:String!, $number:Int!) {
                    repository(owner:$owner, name:$name) {
                      pullRequest(number:$number) {
                        reviewThreads(first:100) {
                          nodes {
                            isResolved
                            isOutdated
                            comments(first:1) { nodes { author { login } } }
                          }
                        }
                      }
                    }
                  }' \
                --jq '[ .data.repository.pullRequest.reviewThreads.nodes[]
                        | select(.isResolved == false and .isOutdated == false)
                        | select(.comments.nodes[0].author.login
                                 | startswith("copilot-pull-request-reviewer")) ] | length')

              if [ "$unresolved" -gt 0 ]; then
                echo "PR #$PR has $unresolved unresolved Copilot review thread(s); not merging."
                return 0
              fi
            fi

            # This workflow and its siblings report their own check runs against the
            # PR head, so excluding them is what stops the gate waiting on itself.
            ignore='["PR review by Copilot","PR reviewed by Copilot","Address Copilot review comments","Auto-merge reviewed PRs","Close parent issues"]'

            # `$w` is bound before the membership test: inside `$ignore | index(...)`
            # the `.` context is the ignore array, not the check run.
            checks=$(echo "$pr_json" | jq -c --argjson ignore "$ignore" \
              '[.statusCheckRollup[] | (.workflowName // "") as $w | select(($ignore | index($w)) == null)]')

            total=$(echo "$checks" | jq 'length')
            if [ "$total" -eq 0 ]; then
              echo "PR #$PR has no CI checks yet; not merging."
              return 0
            fi

            # ACTION_REQUIRED is a run still awaiting approval, which `pr-reviewed`
            # releases — pending, not failed.
            pending=$(echo "$checks" | jq '[.[] | select(
              (.__typename == "CheckRun" and (.status != "COMPLETED" or .conclusion == "ACTION_REQUIRED")) or
              (.__typename == "StatusContext" and (.state == "PENDING" or .state == "EXPECTED"))
            )] | length')

            # Legacy commit statuses carry `context`/`state`; check runs carry
            # `name`/`status`/`conclusion`.
            failed=$(echo "$checks" | jq -c '[.[] | select(
              (.__typename == "CheckRun" and .status == "COMPLETED" and .conclusion != "ACTION_REQUIRED"
                and .conclusion != "SUCCESS" and .conclusion != "NEUTRAL" and .conclusion != "SKIPPED") or
              (.__typename == "StatusContext" and .state != "SUCCESS" and .state != "PENDING" and .state != "EXPECTED")
            ) | (.name // .context)]')

            echo "PR #$PR checks: total=$total pending=$pending failed=$failed"

            if [ "$(echo "$failed" | jq 'length')" -gt 0 ]; then
              echo "::warning::PR #$PR has failing checks: $(echo "$failed" | jq -r 'join(", ")'). Not merging."
              return 0
            fi

            if [ "$pending" -gt 0 ]; then
              echo "PR #$PR still has $pending check(s) running; not merging yet."
              return 0
            fi

            gh pr edit "$PR" --repo "$REPO" --add-label ready-to-merge
            if echo "$pr_json" | jq -e '.labels[] | select(.name == "reviewed")' >/dev/null; then
              gh pr edit "$PR" --repo "$REPO" --remove-label reviewed
            fi
            echo "Labelled #$PR as ready-to-merge."

            # `mergeable` is computed asynchronously and reads UNKNOWN until GitHub
            # catches up; merging on UNKNOWN just fails the job noisily.
            mergeable=$(echo "$pr_json" | jq -r .mergeable)
            for _ in 1 2 3 4 5; do
              if [ "$mergeable" != "UNKNOWN" ]; then break; fi
              sleep 5
              mergeable=$(gh pr view "$PR" --repo "$REPO" --json mergeable --jq .mergeable)
            done

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "::warning::PR #$PR is $mergeable and needs a human. Not merging."
              return 0
            fi

            # Deferred until everything else has passed, so a PR that fails a gate
            # is left exactly as the coding agent had it. `gh pr merge` refuses a
            # draft outright, so this has to happen before the merge rather than
            # being left to whoever opened the PR.
            if [ "$draft" = "true" ]; then
              gh pr ready "$PR" --repo "$REPO"
              echo "Took #$PR out of draft."
            fi

            gh pr merge "$PR" --repo "$REPO" --squash
            MERGED=true
            echo "Squash-merged #$PR."
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"

            # Tidying up the head branch must not fail the merge: fork branches and
            # branches already removed by repository settings both error here.
            branch=$(echo "$pr_json" | jq -r .headRefName)
            if ! gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1; then
              echo "::notice::Head branch '$branch' was not deleted (fork, protected, or already gone)."
            fi

            return 0
          }

          # One merge per run. `close-parents` cascades from a single PR number,
          # and every remaining candidate is now behind a moved `main` anyway —
          # the next sweep re-evaluates them against the new base.
          for candidate in $PRS; do
            evaluate_pr "$candidate"
            if [ "$MERGED" = "true" ]; then
              exit 0
            fi
          done

          echo "No candidate pull request was ready to merge."

  close-parents:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/close-parent-issues.yml
    with:
      pr_number: ${{ fromJSON(needs.merge.outputs.pr) }}
    secrets: inherit
